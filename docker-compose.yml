services:
    adminer:
      image: adminer
      restart: always
      ports:
        - 8080:8080
      networks:
        - sail
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            REVERB_PUBLISH_HOST: reverb
            REVERB_PUBLISH_PORT: '${REVERB_SERVER_PORT:-8085}'
            REVERB_PUBLISH_SCHEME: http
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
    # serves the front, LARAVEL_SAIL makes the plugin bind on 0.0.0.0
    vite:
        image: 'sail-8.4/app'
        command: 'npm run dev'
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
    # carries the progress of the bookmark import
    reverb:
        image: 'sail-8.4/app'
        command: 'php artisan reverb:start --host=0.0.0.0 --port=${REVERB_SERVER_PORT:-8085} --debug'
        ports:
            - '${REVERB_SERVER_PORT:-8085}:${REVERB_SERVER_PORT:-8085}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
    # the bookmark import and its icon lookups run here
    worker:
        image: 'sail-8.4/app'
        command: 'php artisan queue:work --tries=3'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            REVERB_PUBLISH_HOST: reverb
            REVERB_PUBLISH_PORT: '${REVERB_SERVER_PORT:-8085}'
            REVERB_PUBLISH_SCHEME: http
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
    pgsql:
        image: 'postgres:17'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
